<meta charset="UTF-8">

<meta name="theme-color" content="#08090d">
<title>GNG GESTIÓN NORTE SpA - Un Servicio, Múltiples Soluciones</title>

<style>
*, *::before, *::after {
    box-sizing: border-box;
}

body {
    margin: 0;
    min-height: 100vh;
    min-height: 100dvh;
    background: #08090d;
    font-family: Arial, Helvetica, sans-serif;
    overflow: hidden;
    color: white;
}

/* =================================
   FOTOGRAFIAS
================================= */

.fondo {
    position: fixed;
    inset: 0;
    background-position: center;
    background-size: cover;
    background-repeat: no-repeat;
    transition: opacity 2s ease-in-out;
    z-index: 0;
}

#fondo1 { opacity: 1; }
#fondo2 { opacity: 0; }

.overlay {
    position: fixed;
    inset: 0;
    background: rgba(0,0,0,.52);
    z-index: 1;
    cursor: pointer;
}

/* =================================
   CREDITOS AMARILLOS A LA IZQUIERDA
================================= */

.capa-creditos {
    position: fixed;
    top: 130px;
    left: 34px;
    bottom: 24px;
    width: 600px;
    max-width: calc(100vw - 825px);
    background: transparent;
    pointer-events: none;
    z-index: 4;
    overflow: hidden;
    -webkit-mask-image: linear-gradient(
        to bottom,
        transparent 0%,
        black 8%,
        black 92%,
        transparent 100%
    );
    mask-image: linear-gradient(
        to bottom,
        transparent 0%,
        black 8%,
        black 92%,
        transparent 100%
    );
}

.bloque-creditos {
    position: absolute;
    left: 0;
    top: 100%;
    width: 100%;
    text-align: left;
    color: rgba(255, 221, 51, 0.88);
    text-shadow: 0 2px 12px rgba(0, 0, 0, 0.95);
    animation: rodarCreditos 135s linear infinite;
    pointer-events: auto;
    cursor: pointer;
    user-select: none;
    transition: opacity 0.25s ease;
}

.capa-creditos.pausado .bloque-creditos {
    animation-play-state: paused;
    color: rgba(255, 235, 105, 0.98);
}

.indicador-pausa {
    position: fixed;
    bottom: 18px;
    left: 34px;
    z-index: 6;
    padding: 6px 12px;
    border-radius: 14px;
    background: rgba(15, 17, 23, 0.85);
    border: 1px solid rgba(255, 215, 0, 0.45);
    color: #ffd700;
    font-size: 10px;
    font-weight: bold;
    letter-spacing: 1px;
    pointer-events: none;
    opacity: 0;
    transform: translateY(6px);
    transition: opacity 0.25s ease, transform 0.25s ease;
}

.indicador-pausa.visible {
    opacity: 1;
    transform: translateY(0);
}

.bloque-creditos .credito-titulo {
    margin: 0 0 6px 0;
    font-size: 36px;
    font-weight: bold;
    letter-spacing: 1.5px;
    color: rgba(255, 215, 0, 0.97);
}

.bloque-creditos .credito-subtitulo {
    margin: 0 0 26px 0;
    font-size: 16px;
    font-weight: bold;
    letter-spacing: 2px;
    color: rgba(255, 228, 92, 0.92);
}

.bloque-creditos h2 {
    margin: 34px 0 12px 0;
    font-size: 25px;
    letter-spacing: 1px;
    text-transform: uppercase;
    color: rgba(255, 215, 0, 0.98);
    border-bottom: 1px solid rgba(255, 215, 0, 0.28);
    padding-bottom: 6px;
}

.bloque-creditos h3 {
    margin: 22px 0 8px 0;
    font-size: 21px;
    color: rgba(255, 222, 65, 0.96);
}

.bloque-creditos p {
    margin: 0 0 16px 0;
    font-size: 19px;
    line-height: 1.52;
    color: rgba(255, 232, 95, 0.88);
}

.bloque-creditos ul, .bloque-creditos ol {
    margin: 0 0 18px 0;
    padding-left: 22px;
    font-size: 18px;
    line-height: 1.55;
    color: rgba(255, 232, 95, 0.88);
}

.bloque-creditos li {
    margin-bottom: 7px;
}

.bloque-creditos li strong {
    color: rgba(255, 215, 0, 0.98);
}

.bloque-creditos .credito-cierre {
    margin-top: 28px;
    font-size: 21px;
    font-weight: bold;
    color: rgba(255, 215, 0, 0.98);
}

@keyframes rodarCreditos {
    0% { transform: translateY(0); }
    100% { transform: translateY(calc(-100% - 100vh)); }
}

/* =================================
   RELOJ DIGITAL SIETE SEGMENTOS
================================= */

.reloj {
    position: fixed;
    top: 28px;
    left: 32px;
    z-index: 5;
    display: flex;
    align-items: center;
    gap: 5px;
}

.digito {
    position: relative;
    width: 37px;
    height: 65px;
}

.seg {
    position: absolute;
    background: #382719;
    opacity: .55;
}

.seg.encendido {
    background: #ff9b35;
    opacity: 1;
    filter:
        drop-shadow(0 0 4px #ff791b)
        drop-shadow(0 0 9px rgba(255,140,35,.65));
}

.seg.a, .seg.g, .seg.d {
    width: 25px;
    height: 6px;
    left: 6px;
    clip-path: polygon(12% 0,88% 0,100% 50%,88% 100%,12% 100%,0 50%);
}

.seg.a { top: 0; }
.seg.g { top: 29px; }
.seg.d { bottom: 0; }

.seg.b, .seg.c, .seg.e, .seg.f {
    width: 6px;
    height: 25px;
    clip-path: polygon(50% 0,100% 12%,100% 88%,50% 100%,0 88%,0 12%);
}

.seg.f { top: 4px; left: 1px; }
.seg.b { top: 4px; right: 1px; }
.seg.e { bottom: 4px; left: 1px; }
.seg.c { bottom: 4px; right: 1px; }

.dos-puntos {
    height: 65px;
    width: 12px;
    display: flex;
    flex-direction: column;
    justify-content: center;
    align-items: center;
    gap: 14px;
    animation: parpadeo 1s steps(1) infinite;
}

.dos-puntos span {
    width: 6px;
    height: 6px;
    background: #ff9b35;
    border-radius: 1px;
    box-shadow: 0 0 8px #ff791b;
}

@keyframes parpadeo {
    50% { opacity: .15; }
}

.etiqueta-reloj {
    position: fixed;
    top: 101px;
    left: 34px;
    z-index: 5;
    color: #ffad4b;
    font-size: 9px;
    font-weight: bold;
    letter-spacing: 1.2px;
    white-space: nowrap;
}

/* =================================
   TARJETA PRINCIPAL DE EMPRESA
================================= */

.tarjeta-empresa {
    position: fixed;
    z-index: 3;
    right: 35px;
    top: 50%;
    transform: translateY(-50%);
    width: 760px;
    min-height: 230px;
    padding: 28px 32px;

    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 24px;

    background: linear-gradient(120deg, rgba(28,30,37,.97), rgba(9,10,15,.97));
    border: 1px solid rgba(255,169,69,.38);
    border-radius: 22px;
    box-shadow: 0 20px 60px rgba(0,0,0,.8), 0 0 30px rgba(255,115,20,.10);
}

.identidad {
    flex: 1.1;
    min-width: 190px;
}

.marca {
    color: #aaaeb7;
    font-size: 10px;
    letter-spacing: 2px;
    font-weight: bold;
    margin-bottom: 12px;
}

h1 {
    color: #ffad4b;
    font-size: 25px;
    letter-spacing: 0.8px;
    margin: 0;
}

.subtitulo {
    margin-top: 9px;
    font-size: 10px;
    color: #b7b8c0;
    letter-spacing: 1.4px;
}

.etiqueta-estado {
    display: inline-flex;
    align-items: center;
    gap: 7px;
    margin-top: 18px;
    padding: 7px 12px;
    border-radius: 20px;
    color: #ffad4b;
    font-size: 10px;
    letter-spacing: 1px;
    font-weight: bold;
    background: rgba(255,100,30,.12);
    border: 1px solid rgba(255,130,40,.35);
}

.punto {
    width: 7px;
    height: 7px;
    background: #ff642c;
    border-radius: 50%;
    box-shadow: 0 0 9px #ff642c;
    animation: pulso 1.5s infinite;
}

@keyframes pulso {
    50% { opacity: .3; }
}

.servicios {
    flex: 1;
    text-align: left;
    border-left: 1px solid rgba(255,169,69,.18);
    padding-left: 22px;
}

.servicios-titulo {
    color: #ffad4b;
    font-size: 11px;
    font-weight: bold;
    letter-spacing: 1.5px;
    margin-bottom: 10px;
}

.servicios ul {
    margin: 0;
    padding-left: 18px;
    color: #d5d7de;
    font-size: 13px;
    line-height: 1.65;
}

.contacto-box {
    flex: 0.9;
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 10px;
}

.btn-contacto {
    display: inline-block;
    text-decoration: none;
    text-align: center;
    padding: 13px 20px;
    border-radius: 30px;
    background: linear-gradient(145deg, #ffc16b, #f47725, #d94b16);
    color: white;
    font-size: 12px;
    font-weight: bold;
    letter-spacing: 1px;
    box-shadow: 0 8px 25px rgba(255,100,20,.35);
    transition: transform .2s;
    cursor: pointer;
    border: none;
}

.btn-contacto:hover {
    transform: scale(1.05);
}

.dato-extra {
    color: #b7b8c0;
    font-size: 10px;
    text-align: center;
    letter-spacing: 0.8px;
}

.pie {
    position: absolute;
    right: 29px;
    bottom: 9px;
    color: #85868c;
    font-size: 8px;
    letter-spacing: 1px;
}

.pie strong {
    color: #ffad4b;
}

/* =================================
   MODAL DE RESERVAS GNG
================================= */

.gng-modal-overlay {
    display: none;
    position: fixed;
    inset: 0;
    z-index: 9999;
    background: rgba(5, 7, 13, 0.84);
    backdrop-filter: blur(8px);
    -webkit-backdrop-filter: blur(8px);
    align-items: center;
    justify-content: center;
    padding: 16px;
}

.gng-modal-overlay.abierto {
    display: flex;
}

.gng-modal-card {
    position: relative;
    width: 100%;
    max-width: 650px;
    max-height: 92vh;
    overflow-y: auto;
    background: linear-gradient(180deg, #16181f 0%, #0d0f14 100%);
    border: 1px solid rgba(255, 169, 69, 0.42);
    border-radius: 20px;
    box-shadow: 0 28px 70px rgba(0, 0, 0, 0.85);
    color: #f3f4f6;
    font-family: inherit;
    animation: gngModalEntrar 0.25s ease-out;
}

@keyframes gngModalEntrar {
    from { opacity: 0; transform: translateY(14px) scale(0.98); }
    to { opacity: 1; transform: translateY(0) scale(1); }
}

.gng-modal-header {
    position: relative;
    height: 215px;
    overflow: hidden;
    border-bottom: 1px solid rgba(255, 169, 69, 0.28);
}

.gng-modal-header img {
    width: 100%;
    height: 100%;
    object-fit: cover;
    object-position: center 45%;
    display: block;
}

.gng-modal-header-grad {
    position: absolute;
    inset: 0;
    background: linear-gradient(
        180deg,
        rgba(10, 12, 16, 0.20) 0%,
        rgba(13, 15, 20, 0.72) 60%,
        rgba(13, 15, 20, 0.98) 100%
    );
}

.gng-modal-cerrar {
    position: absolute;
    top: 14px;
    right: 14px;
    z-index: 2;
    width: 36px;
    height: 36px;
    border-radius: 50%;
    border: 1px solid rgba(255, 255, 255, 0.25);
    background: rgba(13, 15, 20, 0.78);
    color: #ffffff;
    font-size: 20px;
    line-height: 1;
    cursor: pointer;
    transition: background 0.2s, border-color 0.2s;
}

.gng-modal-cerrar:hover {
    background: #f5821f;
    border-color: #f5821f;
}

.gng-modal-titulo-box {
    position: absolute;
    left: 24px;
    right: 24px;
    bottom: 16px;
    z-index: 2;
}

.gng-modal-badge {

    padding: 4px 10px;
    border-radius: 999px;
    background: rgba(245, 130, 31, 0.20);
